<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>PE Platform Algeria</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{background:#fff;width:min(520px,92%);padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001}h1{margin-top:0}.hidden{display:none}.msg{padding:10px;background:#f1f4f8;border-radius:10px;margin-top:10px;white-space:pre-wrap}.trial{font-size:22px;font-weight:800;margin:15px 0}button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border-radius:10px;border:1px solid #ccd2dc;cursor:pointer;font-weight:700}</style></head><body><main class="card"><h1>PE Platform Algeria</h1><p>منصة التربية البدنية والرياضية</p><section id="auth"><h2>تسجيل الدخول أو إنشاء حساب</h2><input id="name" placeholder="الاسم الكامل" autocomplete="name" style="width:100%;padding:12px;box-sizing:border-box;margin:7px 0"><input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" style="width:100%;padding:12px;box-sizing:border-box;margin:7px 0"><input id="password" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)" autocomplete="current-password" style="width:100%;padding:12px;box-sizing:border-box;margin:7px 0"><button id="registerBtn" type="button">إنشاء حساب والدخول</button><button id="loginBtn" type="button">تسجيل الدخول</button></section><section id="trial" class="hidden"><div class="trial" id="timer">التجربة: 30:00</div><p>يمكنك استعمال المنصة خلال الفترة التجريبية المجانية.</p><button id="openBtn" type="button">دخول إلى المنصة</button><button id="whatsappBtn" type="button">إرسال وصل الدفع عبر واتساب</button></section><section id="expired" class="hidden"><h2>انتهت الفترة التجريبية</h2><p>انتهت مدة التجربة المجانية. أرسل وصل دفع 1000 دج عبر واتساب إلى المسؤول ليتم تفعيل حسابك.</p><button id="whatsappExpiredBtn" type="button">إرسال وصل الدفع عبر واتساب</button></section><div id="msg" class="msg">جاهز.</div></main><script src="/gateway.js"></script></body></html>
