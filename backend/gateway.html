<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>PE Platform Algeria — الاشتراك</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{background:#fff;width:min(520px,92%);padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001}h1{margin-top:0}input,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border-radius:10px;border:1px solid #ccd2dc}button{cursor:pointer;font-weight:700}.price{font-size:26px;font-weight:800;margin:15px 0}.hidden{display:none}.msg{padding:10px;background:#f1f4f8;border-radius:10px;margin-top:10px;white-space:pre-wrap}</style></head><body><main class="card"><h1>PE Platform Algeria</h1><p>منصة التربية البدنية والرياضية</p><section id="auth"><h2>تسجيل الدخول أو إنشاء حساب</h2><input id="name" placeholder="الاسم الكامل" autocomplete="name"><input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email"><input id="password" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)" autocomplete="current-password"><button id="registerBtn" type="button">إنشاء حساب</button><button id="loginBtn" type="button">تسجيل الدخول</button></section><section id="pay" class="hidden"><div class="price">الاشتراك: 1000 دج</div><p>بعد الدفع، أرسل صورة أو ملف PDF لوصل الدفع. سيقوم المسؤول بمراجعته ثم تفعيل حسابك بشكل دائم.</p><input id="receipt" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><button id="receiptBtn" type="button">إرسال وصل الدفع</button><button id="checkBtn" type="button">تحديث حالة الحساب</button></section><div id="msg" class="msg">جاهز.</div></main><script>
const API='https://pe-platform-algeria.onrender.com';const $=id=>document.getElementById(id);let token=localStorage.getItem('pe_token');
function msg(t){$('msg').textContent=t}function setBusy(b){$('registerBtn').disabled=b;$('loginBtn').disabled=b;$('receiptBtn').disabled=b}
async function req(path,opt={}){const r=await fetch(API+path,{...opt,cache:'no-store'});const text=await r.text();let d={};try{d=JSON.parse(text)}catch{}if(!r.ok)throw new Error(d.error||`الخادم أعاد HTTP ${r.status}`);return d}
function showPay(t){$('auth').classList.add('hidden');$('pay').classList.remove('hidden');msg(t)}
async function register(){setBusy(true);msg('جارٍ إنشاء الحساب...');try{const d=await req('/api/v1/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value.trim(),email:$('email').value.trim(),password:$('password').value})});token=d.accessToken;localStorage.setItem('pe_token',token);showPay('تم إنشاء الحساب بنجاح. الاشتراك 1000 دج. اختر وصل الدفع ثم اضغط إرسال.')}catch(e){msg(e.message)}finally{setBusy(false)}}
async function login(){setBusy(true);msg('جارٍ تسجيل الدخول...');try{const d=await req('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=d.accessToken;localStorage.setItem('pe_token',token);await check()}catch(e){msg(e.message)}finally{setBusy(false)}}
async function check(){if(!token){return}try{const d=await req('/api/v1/me',{headers:{Authorization:'Bearer '+token}});if(d.user.status==='ACTIVE'){msg('تم التفعيل. جارٍ فتح المنصة...');const r=await fetch(API+'/api/v1/app',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw new Error('تعذر فتح المنصة.');document.open();document.write(await r.text());document.close()}else showPay(d.user.status==='PENDING_REVIEW'?'تم استلام الوصل. الحساب قيد مراجعة المسؤول.':'تم تسجيل الدخول. الاشتراك 1000 دج. أرسل وصل الدفع.')}catch(e){localStorage.removeItem('pe_token');token=null;$('auth').classList.remove('hidden');$('pay').classList.add('hidden');msg(e.message)}}
async function sendReceipt(){if(!token)return msg('انتهت جلسة الدخول. سجّل الدخول من جديد.');const f=$('receipt').files[0];if(!f)return msg('اختر صورة أو PDF لوصل الدفع أولًا.');if(f.size>8*1024*1024)return msg('حجم الملف يجب ألا يتجاوز 8 ميغابايت.');setBusy(true);msg('جارٍ إرسال الوصل...');try{await req('/api/v1/me',{headers:{Authorization:'Bearer '+token}});const fd=new FormData();fd.append('receipt',f,f.name);const d=await req('/api/v1/payments/receipt',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});msg(d.message||'تم إرسال الوصل بنجاح.');$('receipt').value='';}catch(e){msg('تعذر إرسال الوصل: '+e.message)}finally{setBusy(false)}}
$('registerBtn').onclick=register;$('loginBtn').onclick=login;$('receiptBtn').onclick=sendReceipt;$('checkBtn').onclick=check;window.addEventListener('load',()=>check());
</script></body></html>
