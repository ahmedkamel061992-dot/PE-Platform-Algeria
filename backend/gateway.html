<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PE Platform Algeria — الاشتراك</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{background:#fff;width:min(520px,92%);padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001}h1{margin-top:0}input,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border-radius:10px;border:1px solid #ccd2dc}button{cursor:pointer;font-weight:700}.price{font-size:26px;font-weight:800;margin:15px 0}.hidden{display:none}.msg{padding:10px;background:#f1f4f8;border-radius:10px;margin-top:10px}</style></head><body><main class="card"><h1>PE Platform Algeria</h1><p>منصة التربية البدنية والرياضية</p><section id="auth"><h2>تسجيل الدخول أو إنشاء حساب</h2><input id="name" placeholder="الاسم الكامل"><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)"><button onclick="register()">إنشاء حساب</button><button onclick="login()">تسجيل الدخول</button></section><section id="pay" class="hidden"><div class="price">الاشتراك: 1000 دج</div><p>بعد الدفع، أرسل صورة أو ملف PDF لوصل الدفع. سيقوم المسؤول بمراجعته ثم تفعيل حسابك بشكل دائم.</p><input id="receipt" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><button onclick="sendReceipt()">إرسال وصل الدفع</button><button onclick="check()">تحديث حالة الحساب</button></section><div id="msg" class="msg"></div></main><script>const API='https://pe-platform-algeria.onrender.com';const el=id=>document.getElementById(id);let token=localStorage.getItem('pe_token');const msg=t=>el('msg').textContent=t;async function register(){try{const r=await fetch(API+'/api/v1/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:el('name').value.trim(),email:el('email').value.trim(),password:el('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر إنشاء الحساب.');token=d.accessToken;localStorage.setItem('pe_token',token);await check()}catch(e){msg(e.message)}}async function login(){try{const r=await fetch(API+'/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:el('email').value.trim(),password:el('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تسجيل الدخول.');token=d.accessToken;localStorage.setItem('pe_token',token);await check()}catch(e){msg(e.message)}}async function check(){if(!token)return;try{const r=await fetch(API+'/api/v1/me',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok){localStorage.removeItem('pe_token');token=null;return msg(d.error||'انتهت الجلسة.')}el('auth').classList.add('hidden');if(d.user.status==='ACTIVE'){msg('تم تفعيل حسابك. جارٍ فتح المنصة...');const r2=await fetch(API+'/api/v1/app',{headers:{Authorization:'Bearer '+token}});if(r2.ok){const html=await r2.text();document.open();document.write(html);document.close()}else msg('تعذر فتح المنصة.')}else{el('pay').classList.remove('hidden');msg(d.user.status==='PENDING_REVIEW'?'تم استلام الوصل. حسابك قيد مراجعة المسؤول.':'يجب إتمام الاشتراك وإرسال وصل الدفع.')}}catch(e){msg('تعذر الاتصال بالخادم. تحقق من اتصال الإنترنت ثم حاول مرة أخرى.')}}async function sendReceipt(){const f=el('receipt').files[0];if(!f)return msg('اختر وصل الدفع أولًا.');try{const fd=new FormData();fd.append('receipt',f);const r=await fetch(API+'/api/v1/payments/receipt',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});const d=await r.json();msg(d.message||d.error||'تعذر إرسال الوصل.');if(r.ok)el('receipt').value=''}catch(e){msg('تعذر الاتصال بالخادم.')}}check();</script></body></html>
