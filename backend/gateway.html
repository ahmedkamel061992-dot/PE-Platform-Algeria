<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>PE Platform Algeria — الاشتراك</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{background:#fff;width:min(520px,92%);padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001}h1{margin-top:0}input,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border-radius:10px;border:1px solid #ccd2dc}button{cursor:pointer;font-weight:700}.price{font-size:26px;font-weight:800;margin:15px 0}.hidden{display:none}.msg{padding:10px;background:#f1f4f8;border-radius:10px;margin-top:10px}</style></head><body><main class="card"><h1>PE Platform Algeria</h1><p>منصة التربية البدنية والرياضية</p><section id="auth"><h2>تسجيل الدخول أو إنشاء حساب</h2><input id="name" placeholder="الاسم الكامل" autocomplete="name"><input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email"><input id="password" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)" autocomplete="new-password"><button id="registerBtn" type="button">إنشاء حساب</button><button id="loginBtn" type="button">تسجيل الدخول</button></section><section id="pay" class="hidden"><div class="price">الاشتراك: 1000 دج</div><p>بعد الدفع، أرسل صورة أو ملف PDF لوصل الدفع. سيقوم المسؤول بمراجعته ثم تفعيل حسابك بشكل دائم.</p><input id="receipt" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><button id="receiptBtn" type="button">إرسال وصل الدفع</button><button id="checkBtn" type="button">تحديث حالة الحساب</button></section><div id="msg" class="msg">جاهز.</div></main><script src="/gateway.js?v=2" defer></script></body></html>
